[project]
name = "chessme-pipeline"
version = "0.1.0"
description = "Data side of ChessMe: turns raw PGN into the datasets the Bot is built and measured on."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["chess>=1.11", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Converting, verifying and measuring the candidate Base Models. Install the
# CPU build of torch first, from https://download.pytorch.org/whl/cpu, or pip
# pulls the much larger GPU build.
models = [
    "brotli>=1.1",
    "torch>=2.5",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.20",
    # CSSLab's reference implementation of Maia-3, pinned to a commit.
    "maia3 @ git+https://github.com/CSSLab/maia3@1e13597c42d4858b7cfd7cfdae01e297263364b2",
]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline"]
