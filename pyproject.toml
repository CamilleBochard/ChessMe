[project]
name = "chessme-pipeline"
version = "0.1.0"
description = "Data side of ChessMe: turns raw PGN into the datasets the Bot is built and measured on."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["chess>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline"]
