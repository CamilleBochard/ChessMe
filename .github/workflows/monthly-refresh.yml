# The monthly refresh: Camille's new games, everything built from them, the
# checks, the publication and the deployment, with the previous version
# restored when anything after the publication fails. Written up in
# docs/monthly-refresh.md, with how to run each stage and roll back by hand.
#
# Six stages, each a job that runs only when the one before succeeded:
#   1. refresh      the games and everything built from them, on a branch
#   2. checks       tests, the Opening Book, the build, 20 games, the
#                   regression gate on Move-Matching
#   3. publish      the bot-data release, its checksums, the commit on master
#   4. deploy       deploy.yml, called with that commit
#   5. production   the checks against production, with retries
#   6. rollback     after a failure once published: the previous images,
#                   master reverted, the release marked, an issue opened
# The Stockfish caches and the served model's records persist between runs
# as assets of the pipeline-state release, saved again only after a run
# that deployed.
name: Monthly refresh

on:
  schedule:
    # 04:00 UTC on the first day of each month.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      continue_without_new_games:
        description: Go on even when no game is new, to run every stage again
        type: boolean
        default: false
      fail_checks_after_deploying:
        description: Fail the checks after deploying on purpose, to exercise the rollback
        type: boolean
        default: false

# No permission by default: each job asks only for what it needs.
permissions: {}

# One refresh at a time; deploy.yml keeps its own lock on production.
concurrency:
  group: monthly-refresh
  cancel-in-progress: false

env:
  STATE_RELEASE: pipeline-state
  NODE_VERSION: 22.12.0
  PYTHON_VERSION: "3.12"
  # The served model, in the release named in docker/bot-data-release.
  SERVED_MODEL: models/onnx/maia3-5m-fine-tuned.onnx

jobs:
  refresh:
    name: 1. Refresh the games and everything built from them
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # Pushes the refresh's branch; reads the public releases.
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      go_on: ${{ steps.fetch.outputs.go_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pipeline, the Node packages and Stockfish
        run: |
          python -m pip install -q -e .
          npm ci --no-audit --no-fund --loglevel=error
          bash scripts/fetch_stockfish.sh

      - name: Download the served model and Opening Book
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/monthly-refresh/download-bot-data.sh

      - name: Restore the Stockfish caches and the model's records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.pipeline_state restore

      # First on every run: a hosted runner may land on another processor
      # each month, and a build that scores differently would mix two
      # measures in one cache.
      - name: Check Stockfish against its caches
        run: python -m pipeline.check_engines --workers 4

      # What the site was built from, rebuilt from the repository and the
      # caches, so the summary compares the refresh with it. Nothing is
      # analysed; its own summary and yardsticks are dropped.
      - name: Rebuild what was served
        run: |
          python -m pipeline.refresh_games --no-fetch --workers 4
          rm -f "docs/refreshes/$(date -u +%Y-%m-%d).json"
          git checkout -- src/explanation

      # The only step that sees the Lichess token.
      - name: Fetch the new games
        id: fetch
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          CONTINUE_WITHOUT_NEW_GAMES: ${{ inputs.continue_without_new_games }}
        run: |
          python -m pipeline.fetch_games
          git ls-files --others --exclude-standard -- data/raw > "$RUNNER_TEMP/fetched.txt"
          if [ -s "$RUNNER_TEMP/fetched.txt" ] || [ "$CONTINUE_WITHOUT_NEW_GAMES" = "true" ]; then
            echo "go_on=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new game: the refresh stops here."
            echo "go_on=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh everything built from the games
        if: steps.fetch.outputs.go_on == 'true'
        run: |
          mapfile -t fetched < "$RUNNER_TEMP/fetched.txt"
          python -m pipeline.refresh_games --no-fetch --workers 4 --fetched "${fetched[@]}"

      - name: Commit the refresh on its own branch
        id: branch
        if: steps.fetch.outputs.go_on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="refresh-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/raw docs/refreshes src/explanation
          git commit -m "Refresh Camille's games on $(date -u +%Y-%m-%d)" -m "Written by the monthly refresh, run ${GITHUB_RUN_ID}."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Keep what the next stages need
        if: steps.fetch.outputs.go_on == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed
          retention-days: 7
          path: |
            data/dataset/opening-book.json
            data/dataset/train.jsonl
            data/dataset/test.jsonl
            data/dataset/move-probabilities/fine-tuned-test.jsonl
            data/analysis/stockfish-19-depth-18.jsonl
            data/analysis/stockfish-19-lite-wasm-depth-14.jsonl

  checks:
    name: 2. Check before deploying
    needs: refresh
    if: needs.refresh.outputs.go_on == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout the refresh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pipeline and the Node packages
        run: |
          python -m pip install -q -e ".[dev]"
          npm ci --no-audit --no-fund --loglevel=error

      - name: Download the served model and Opening Book
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/monthly-refresh/download-bot-data.sh
          mkdir -p "$RUNNER_TEMP/served"
          mv data/dataset/opening-book.json "$RUNNER_TEMP/served/opening-book.json"

      - name: Bring the refreshed files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed
          # Stored relative to data/, the folder its files share.
          path: data

      - name: Run the test suites and the typecheck
        run: |
          npm test
          python -m pytest -q pipeline/tests
          npx astro check

      - name: Check the Opening Book
        run: npm run check-opening-book

      - name: Build the site
        run: npm run build

      # Whether the Bot runs with the new book, not how well it plays.
      - name: Play 20 games with the new Opening Book
        run: |
          npm run --silent bot-games -- --games 20 --temperature 1 --opening-cut top-k=10 \
            --opponent-rating 1100 --opponent-model "$SERVED_MODEL" --out "$RUNNER_TEMP/games.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/games.jsonl")" -eq 20

      # The served Bot and the same Bot with the new book, on the same Test
      # Set positions; the gate fails the run when Move-Matching falls by more
      # than two standard errors of the change.
      - name: Gate on Move-Matching
        run: |
          npm run --silent compare-bots -- "$SERVED_MODEL" "$SERVED_MODEL" \
            --first-opening-cut top-k=10 --second-opening-cut top-k=10 \
            --first-book "$RUNNER_TEMP/served/opening-book.json" --second-book data/dataset/opening-book.json \
            --record "$RUNNER_TEMP/matching.json"
          npm run --silent regression-gate -- --matching "$RUNNER_TEMP/matching.json"

  publish:
    name: 3. Publish
    needs: [refresh, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Creates the release and pushes master.
    permissions:
      contents: write
    outputs:
      release: ${{ steps.publish.outputs.release }}
      commit: ${{ steps.publish.outputs.commit }}
      previous_commit: ${{ steps.publish.outputs.previous_commit }}
    steps:
      - name: Checkout the refresh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the served model
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/monthly-refresh/download-bot-data.sh

      - name: Bring the refreshed Opening Book
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed
          # Stored relative to data/, the folder its files share.
          path: data

      - name: Publish the release and the commit on master
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.refresh.outputs.branch }}
        run: scripts/monthly-refresh/publish.sh

  deploy:
    name: 4. Deploy
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.publish.outputs.commit }}
    secrets: inherit
    # What deploy.yml's jobs ask for: read the code, write the images.
    permissions:
      contents: read
      packages: write

  production:
    name: 5. Check production
    needs: [publish, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The production address is a variable of the environment, never written
    # in the repository.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout the published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the checks and a browser
        run: |
          python -m pip install -q -e ".[production-check]"
          python -m playwright install --with-deps chromium

      - name: Check production, with retries
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          FAIL_ON_PURPOSE: ${{ inputs.fail_checks_after_deploying }}
        run: |
          extra=()
          if [ "$FAIL_ON_PURPOSE" = "true" ]; then
            extra+=(--fail-on-purpose)
          fi
          python -m pipeline.check_production "$PRODUCTION_URL" "${extra[@]}"

  save-state:
    name: Save the Stockfish caches and the model's records
    needs: [publish, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Replaces the pipeline-state release's assets.
    permissions:
      contents: write
    steps:
      - name: Checkout the published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false

      # pipeline_state.py needs the standard library only: no install.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bring the refreshed caches and records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed
          # Stored relative to data/, the folder its files share.
          path: data

      - name: Save them as the pipeline-state release's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.pipeline_state save --stamp "$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"

  rollback-deploy:
    name: 6. Roll back the deployment
    needs: [publish, deploy, production]
    if: ${{ failure() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.publish.outputs.previous_commit }}
      # The previous commit was deployed: its images are on GHCR already.
      skip_build: true
    secrets: inherit
    permissions:
      contents: read
      packages: write

  rollback-record:
    name: 6. Revert master, mark the release, open an issue
    needs: [refresh, checks, publish, deploy, production, rollback-deploy]
    if: ${{ always() && needs.publish.result == 'success' && (needs.deploy.result == 'failure' || needs.production.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pushes the revert, edits the release, opens the issue.
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Revert, mark and report
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.publish.outputs.release }}
          COMMIT: ${{ needs.publish.outputs.commit }}
          PREVIOUS_COMMIT: ${{ needs.publish.outputs.previous_commit }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          ROLLBACK_DEPLOY_RESULT: ${{ needs.rollback-deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/monthly-refresh/rollback.sh
