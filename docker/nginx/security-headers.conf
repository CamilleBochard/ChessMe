# Security headers, included in every location of default.conf: nginx drops
# the server block's add_header in a location that sets its own.
# `always`: also sent with error responses.
# HSTS is added by the reverse proxy.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Only the site's own files run. 'wasm-unsafe-eval' lets the page compile
# the ONNX Runtime's WebAssembly, and nothing else: eval() stays blocked.
# The Bot's worker is a file of the site; Chessground draws its pieces from
# data: URLs in its stylesheet.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
