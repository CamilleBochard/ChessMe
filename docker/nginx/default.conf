# Static site server, behind the reverse proxy (which handles HTTPS).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in headers and error pages.
    server_tokens off;

    # Relative redirects: otherwise nginx would write its own port (8080)
    # in the URL, unreachable behind the proxy.
    absolute_redirect off;

    # ---------- Compression ----------
    # The WebAssembly runtime (14 MB) compresses well. The Base Model does
    # not: its weights are close to random bytes, so it is sent as is.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json application/wasm image/svg+xml;

    # ---------- Cache ----------
    # Built files and the Base Model: their names carry a hash of their
    # content, so a new version arrives under a new name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /models/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # HTML: revalidated on every visit, answered with 304 when unchanged.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
